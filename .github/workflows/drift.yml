name: drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - staging-aws
          - production-aws
          - staging-gcp
          - production-gcp
          - staging-azure
          - production-azure
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Authenticate to AWS
        if: contains(matrix.target, 'aws')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Authenticate to GCP
        if: contains(matrix.target, 'gcp')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Authenticate to Azure
        if: contains(matrix.target, 'azure')
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fail when the plan is not empty
        working-directory: infra/environments/${{ matrix.target }}
        run: |
          terraform init -input=false
          terraform plan -detailed-exitcode -input=false -var "git_ref=${{ github.sha }}"
