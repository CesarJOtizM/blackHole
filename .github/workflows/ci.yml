name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm typecheck
      - run: pnpm vitest run --project platform
      - run: pnpm vitest run --project api-cloud
      - run: pnpm vitest run --project skeleton
      - run: pnpm architecture
      - run: node tools/infra/compare-module-outputs.mjs
      - run: node tools/infra/check-postgres-extensions.mjs
      - run: node tools/infra/check-forward-migrations.mjs
      - run: node tools/observability/check-catalog.mjs
      - run: node tools/load/factus-rate.mjs

  plan:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        cloud: [aws, gcp, azure]
        environment: [staging, production]
    environment: ${{ matrix.environment }}-${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Authenticate to AWS
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Authenticate to GCP
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Authenticate to Azure
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Plan
        working-directory: infra/environments/${{ matrix.environment }}-${{ matrix.cloud }}
        run: |
          terraform init -input=false
          terraform plan -input=false -var "git_ref=${{ github.sha }}"
