services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: blackhole
      POSTGRES_PASSWORD: blackhole
      POSTGRES_DB: blackhole
  api:
    build:
      context: .
      dockerfile: apps/api-cloud/Dockerfile
    env_file:
      - infra/environments/local/.env.example
    command:
      - node
      - --experimental-strip-types
      - apps/api-cloud/src/composition/main.ts
    depends_on:
      - postgres
  worker:
    build:
      context: .
      dockerfile: apps/api-cloud/Dockerfile
    env_file:
      - infra/environments/local/.env.example
    command:
      - node
      - --experimental-strip-types
      - apps/api-cloud/src/composition/worker.ts
    depends_on:
      - postgres
